<!-- login.component.html -->
<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo / Brand -->
    <div class="brand">
      <div class="brand-icon">
        <img src="images/logo.png" alt="Make My e Notes Logo"
        />
      </div>
      <h1>Make <span>My e Notes</span></h1>
      <p class="subtitle">Sign in to your account</p>
    </div>

    <!-- Message -->
    <p *ngIf="message" class="message">{{ message }}</p>

    <!-- Login Form -->
    <form (ngSubmit)="handleSubmit()" class="login-form">
      <div class="input-group">
        <span class="input-icon">✉️</span>
        <input
          type="email"
          placeholder="Email address"
          [(ngModel)]="formData.email"
          name="email"
          required
        />
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input
          type="password"
          placeholder="Password"
          [(ngModel)]="formData.password"
          name="password"
          required
        />
      </div>

      <button type="submit" class="btn-primary">Login</button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <hr class="divider-line" />
      <span class="divider-text">or continue with</span>
      <hr class="divider-line" />
    </div>

    <!-- Google Login -->
    <button class="btn-google" (click)="loginWithGoogle()">
      <svg class="google-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-8H6.1C9.4 35.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.2 5.2C41 35.2 44 30 44 24c0-1.3-.1-2.6-.4-3.9z"/>
      </svg>
      Sign in with Google
    </button>

    <!-- Register Link -->
    <p class="register-link">
      Don't have an account?
      <a routerLink="/register" routerLinkActive="active">Register</a>
    </p>

  </div>
</div>
